<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dwarf Delver Pre-release</title>
  <link rel="stylesheet" href="./css/styles.css?v=chest-open-1" />
</head>
<body>
  <div id="app">
    <div id="leftCol">
      <div class="panel">
        <div class="topline">
          <div>
            <strong>Dwarf Delver Pre-release</strong>
            <div class="hint">左クリック: 採掘 / 右クリック: 危険看板 / 数字をダブルクリック: 周囲を一括採掘（旗数一致時） / Nキー: 次階層へ / Esc: アイテム解除</div>
          </div>
          <div id="phasePill" class="pill">B1F</div>
        </div>
        <div id="statusText" class="hint">入口から洞窟を掘り進めて出口を探そう～</div>
      </div>
      <div class="panel top-vitals" aria-label="主人公のHPと経験値">
        <div class="pixel-meter" id="hpMeter"><div class="meter-track hp-track"><div id="hpBar" class="meter-art hpFill"></div><span id="hpText" class="meter-number" aria-label="HP:100/100">HP:100/100</span></div></div>
        <div class="pixel-meter"><div class="meter-track xp-track"><div id="xpBar" class="meter-art xpFill"></div><span id="xpText" class="meter-number" aria-label="EXP:NEXT→100">EXP:NEXT→100</span></div></div>
        <div id="levelText" class="meter-number level-readout" aria-label="Lv.1">Lv.1</div>
      </div>
      <div id="boardWrap">
        <div id="inventoryDock" role="group" aria-label="所持アイテム"></div>
        <canvas id="gameCanvas" width="1200" height="864"></canvas>
        <div id="overlay"></div>
        <div id="itemOverlay"></div>
        <div id="messageBanner"></div>
        <div id="exitDialog"></div>
      </div>
    </div>

    <div id="rightCol">
      <div class="panel">
        <h2>主人公</h2>
        <div class="miniGrid">
          <div class="upgradeItem">防御 <strong id="defText">0%</strong></div>
          <div class="upgradeItem">精霊 <strong id="dwarfText">1</strong></div>
          <div class="upgradeItem">出現間隔 <strong id="spawnText">9.00s</strong></div>
        </div>
        <button id="descendBtn" hidden disabled>B2Fに降りる</button>
      </div>

      <div class="panel">
        <h2>能力強化</h2>
        <div id="upgradesBox" class="miniGrid"></div>
      </div>

      <div class="panel">
        <h2>フロア情報</h2>
        <div id="floorInfo"></div>
      </div>

      <div class="panel">
        <h2>ログ</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <div id="lootDialog" class="item-dialog-layer"></div>
  <div id="itemConfirmDialog" class="item-dialog-layer"></div>
  <script src="./js/config-chests-v1.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/assets-chests-v1.js?v=chest-open-1"></script>
  <script src="./js/state.js"></script>
  <script src="./js/board.js?v=chest-open-1"></script>
  <script src="./js/systems-chests-v1.js?v=chest-open-1"></script>
  <script src="./js/ui-chests-v1.js?v=chest-open-1"></script>
  <script src="./js/render-chests-v1.js?v=chest-open-1"></script>
  <script src="./js/main-chests-v1.js?v=chest-open-1"></script>
</body>
</html>
